<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="J TEC Downloader - Download supported video and audio media."
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>J TEC Downloader</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- =====================================================
         APP
    ====================================================== -->

    <div id="app">

        <!-- HEADER -->

        <header class="site-header">

            <a
                href="./"
                class="brand"
                aria-label="J TEC Downloader Home"
            >
                <span class="brand-main">J TEC</span>
                <span class="brand-sub">DOWNLOADER</span>
            </a>

        </header>


        <!-- =================================================
             MAIN
        ================================================== -->

        <main class="main-content">

            <!-- HERO -->

            <section class="hero-section">

                <div class="hero-badge">
                    FAST • SIMPLE • QUALITY
                </div>

                <h1>
                    Download
                    <span>Anything.</span>
                </h1>

                <p class="hero-description">
                    Paste a supported media link and choose
                    video or audio.
                </p>

            </section>


            <!-- =================================================
                 DOWNLOADER
            ================================================== -->

            <section class="downloader-card">

                <div class="input-group">

                    <label for="media-url">
                        Media URL
                    </label>

                    <div class="url-input-wrapper">

                        <input
                            id="media-url"
                            type="url"
                            inputmode="url"
                            autocomplete="off"
                            placeholder="Paste your video link here..."
                            aria-label="Media URL"
                        >

                        <button
                            id="clear-url"
                            class="clear-button"
                            type="button"
                            aria-label="Clear URL"
                            hidden
                        >
                            ×
                        </button>

                    </div>

                </div>


                <button
                    id="get-media-button"
                    class="primary-button"
                    type="button"
                >
                    <span class="button-text">
                        Get Media
                    </span>

                    <span
                        class="button-loader"
                        aria-hidden="true"
                        hidden
                    ></span>
                </button>


                <!-- ERROR -->

                <div
                    id="error-message"
                    class="message error-message"
                    role="alert"
                    hidden
                ></div>


                <!-- =================================================
                     MEDIA RESULT
                ================================================== -->

                <div
                    id="media-result"
                    class="media-result"
                    hidden
                >

                    <div class="thumbnail-wrapper">

                        <img
                            id="media-thumbnail"
                            src=""
                            alt="Media thumbnail"
                        >

                    </div>


                    <div class="media-details">

                        <h2 id="media-title">
                            Media title
                        </h2>

                        <p id="media-uploader"></p>

                        <p id="media-duration"></p>

                    </div>


                    <!-- DOWNLOAD OPTIONS -->

                    <div class="download-options">

                        <div class="option-group">

                            <label for="download-type">
                                Download
                            </label>

                            <select id="download-type">

                                <option value="video">
                                    Video + Audio
                                </option>

                                <option value="audio">
                                    Audio Only
                                </option>

                            </select>

                        </div>


                        <div class="option-group">

                            <label for="quality">
                                Quality
                            </label>

                            <select id="quality">

                                <option value="best">
                                    Best Available
                                </option>

                                <option value="1080">
                                    Up to 1080p
                                </option>

                                <option value="720">
                                    Up to 720p
                                </option>

                                <option value="480">
                                    Up to 480p
                                </option>

                            </select>

                        </div>

                    </div>


                    <button
                        id="download-button"
                        class="download-button"
                        type="button"
                    >
                        <span class="button-text">
                            Download
                        </span>

                        <span
                            class="button-loader"
                            aria-hidden="true"
                            hidden
                        ></span>
                    </button>

                </div>

            </section>


            <!-- =================================================
                 SUPPORTED PLATFORMS
            ================================================== -->

            <section class="platforms-section">

                <p class="section-label">
                    SUPPORTED PLATFORMS
                </p>

                <div class="platform-list">

                    <span>TikTok</span>
                    <span>YouTube</span>
                    <span>Instagram</span>
                    <span>Facebook</span>
                    <span>More</span>

                </div>

            </section>

        </main>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="site-footer">

            <p>
                © 2026 J TEC Downloader
            </p>

            <p>
                Download content you have permission to save.
            </p>

        </footer>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./js/config.js"></script>
    <script src="./js/app.js"></script>

</body>
</html>
